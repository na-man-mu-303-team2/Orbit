name: Build and push images

# Build the env-agnostic backend images once in CI and push them to GHCR so the
# AWS production deploy can pull prebuilt images instead of building on the
# deploy host. Production web assets are built statically in the deploy
# workflow, so this workflow only publishes backend images. See
# docs/runbooks/deploy-image-registry-migration.md.
#
# The backend images remain multi-arch (linux/amd64 + linux/arm64) so the
# production architecture can change without rebuilding the release contract.
# Each arch is built natively on its own runner and merged into one manifest
# list per tag.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/docker/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Build each architecture on a native runner (no QEMU emulation): amd64 on
    # ubuntu-latest, arm64 on ubuntu-24.04-arm. Push by digest only; the merge
    # job assembles the per-arch digests into a single tagged manifest list.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, python-worker]
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Prepare platform pair
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/na-man-mu-303-team2/orbit-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Combine the per-architecture digests into one multi-arch manifest list per
    # tag (:<sha> and :<branch>), matching the tags the deploys pull.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, python-worker]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          image="ghcr.io/na-man-mu-303-team2/orbit-${{ matrix.service }}"
          docker buildx imagetools create \
            -t "${image}:${{ github.sha }}" \
            -t "${image}:${{ github.ref_name }}" \
            $(printf "${image}@sha256:%s " *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/na-man-mu-303-team2/orbit-${{ matrix.service }}:${{ github.sha }}"

  publish-ecr:
    # ECS tasks consume an immutable repository digest. This job copies the
    # already-built main manifest list to the production ECR repositories; it
    # does not deploy or change CloudFormation.
    if: github.ref_name == 'main' && vars.AWS_ECR_PUBLISH_ROLE_ARN != ''
    needs: merge
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, python-worker]
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy immutable manifest list and record digest
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          source="ghcr.io/na-man-mu-303-team2/orbit-${{ matrix.service }}:${{ github.sha }}"
          repository="orbit/${{ matrix.service }}"
          target="${ECR_REGISTRY}/${repository}:${{ github.sha }}"
          digest="$(aws ecr describe-images --repository-name "$repository" --image-ids imageTag="${{ github.sha }}" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          if [ -z "$digest" ] || [ "$digest" = "None" ]; then
            docker buildx imagetools create -t "$target" "$source"
            digest="$(aws ecr describe-images --repository-name "$repository" --image-ids imageTag="${{ github.sha }}" --query 'imageDetails[0].imageDigest' --output text)"
          fi
          test -n "$digest"
          test "$digest" != "None"
          printf '%s\n' "${ECR_REGISTRY}/${repository}@${digest}" > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ecr-digest-${{ matrix.service }}
          path: image-digest.txt
          retention-days: 7
